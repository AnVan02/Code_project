<body>
    <script src="bai6.js"></script>
    <script>
        for(phongban of cty)
            document.write(`<table border="1">
                <caption>Phòng ${Object.keys(phongban)}</caption>
                <thead><tr><th>Họ tên</th>
                <th>Tuổi</th><th>Email</th></tr></thead><tbody>
                ${phongban[Object.keys(phongban)].map(nv => {
                    return`<tr>
                        <td>${nv.ten}</td>
                        <td>${nv.tuoi}</td>
                        <td>${nv.email}</td>
                </tr>`}).join('')}
            </tbody>
            </table>`)
        
    </script>
